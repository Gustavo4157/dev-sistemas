<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Empresa do Gustavo</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <h1>Tela de Login</h1>
    </header>
    <main> 
        <section>
            <h2>Entrar no sistema</h2>
            <form id="form-login-gustavo" action="#" method="post" novalidate>
                <fieldset>
                    <div class="campo-gustavo">
                        <label for="email-gustavo">Email</label>
                        <input type="email" id="email-gustavo" name="email-gustavo" placeholder="Ex: Gustavo Silva" 
                        required minlength="3" maxlength="100">
                    </div>
                    <div class="campo-gustavo">
                        <label for="senha-gustavo">Senha</label>
                        <input type="password" id="senha-gustavo" name="senha-gustavo" placeholder="Ex: 123456" 
                        required minlength="6">
                    </div>
                    <div class="campo-gustavo">
                        <label for="ldm-gustavo">Lembrar de mim</label>
                        <input type="checkbox" id="ldm-gustavo" name="ldm-gustavo">
                    </div>
                    <button type="submit" class="btn-submit-gustavo">Enviar Formulário</button>
                    <a href="#">Esqueci minha senha</a>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p>Empresa do Gustavo 2026</p>
    </footer>
</body>
</html>
